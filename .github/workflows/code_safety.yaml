name: Go

on:
  pull_request:
    branches: ['main', 'dev']

jobs:
  check_vulnerability:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27.x'
      - name: Vulnerability check
        working-directory: ./api
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Security scan (gosec)
        working-directory: ./api
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          "$(go env GOPATH)/bin/gosec" ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          install-mode: goinstall

  run_unit_tests:
    runs-on: ubuntu-latest
    needs: ['check_vulnerability']
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Install dependencies
        working-directory: ./api
        run: go get .
      - name: Build
        working-directory: ./api
        run: go build -v ./...

      - name: Test with the Go CLI
        working-directory: ./api
        run: go test -json ./... > TestResults.json
      - name: Upload Go test results
        uses: actions/upload-artifact@v4
        with:
          name: ./api/Go-results
          path: ./api/TestResults.json

  automated-api-tests:
    runs-on: ubuntu-latest
    env:
      DB_PORT: 5432
      DB_NAME: dengine
      DB_USER: test
      DB_PWD: test
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Start Database
        run: |
          docker pull ghcr.io/D-Gine/dengine-db:latest
          docker run -d --name dengine-db \
            -e PGPORT=$DB_PORT \
            -e POSTGRES_DB=$DB_NAME \
            -e POSTGRES_USER=$DB_USER \
            -e POSTGRES_PASSWORD=$DB_PWD \
            -p $DB_PORT:$DB_PORT \
            --health-cmd="pg_isready -U $DB_USER -d $DB_NAME" \
            --health-interval=2s --health-timeout=5s --health-retries=30 \
            ghcr.io/D-Gine/dengine-db:latest

      - name: Wait for DB to be healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' dengine-db)
            [ "$status" = "healthy" ] && exit 0
            sleep 2
          done
          docker logs dengine-db
          exit 1

      - name: Install Postman CLI
        run: |
          curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run "58711414-51d416b8-5719-40a3-8141-d0f6e60af21f"
