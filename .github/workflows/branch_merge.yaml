name: Branch merging actions
on:
  pull_request:
    types: [closed]
    branches-ignore:
      - main
      - dev

jobs:
  delete_merged_branch:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete branch
        run: git push origin --delete ${{ github.event.pull_request.head.ref }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
