services:
  dengine-api:
    container_name: dengine-api-${VERSION}
    build: ./api
    env_file: ".env"
    ports:
      - "${API_PORT}:${API_PORT}"
    networks:
      - back
      - front
    volumes:
      - ${API_SRC:-api-src}:/app/src
      - go-build-cache:/root/.cache/go-build
      - go-mod-cache:/go/pkg/mod

volumes:
  api-src:
  go-build-cache:
  go-mod-cache:
  api:
    name: ${API_VOLUME}

networks:
  back:
    external: true
    name: ${BACK_NETWORK}
  front:
    name: ${FRONT_NETWORK}