definitions:
  CRUDTEMPLATE.CreateCRUDTEMPLATEsArgs:
    properties:
      name:
        type: string
    type: object
  CRUDTEMPLATE.DbReadResponse:
    properties:
      id:
        type: string
    type: object
  CRUDTEMPLATE.UpdateArgs:
    properties:
      name:
        type: string
    type: object
  account.UpdateArgs:
    properties:
      email:
        type: string
      image:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  account.UserReadResponse:
    properties:
      email:
        type: string
      id:
        type: string
      image:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  apidata.About:
    properties:
      status:
        type: string
    type: object
  auth.Creds:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  auth.PostLoginResponse:
    properties:
      id:
        type: string
      token:
        type: string
    type: object
  auth.RegisterArgs:
    properties:
      email:
        type: string
      image:
        type: string
      password:
        type: string
      username:
        type: string
    type: object
  characters.CharacterReadResponse:
    properties:
      components:
        items:
          $ref: '#/definitions/characters.Component_'
        type: array
      name:
        type: string
    type: object
  characters.Component:
    properties:
      name:
        type: string
      type:
        $ref: '#/definitions/nodes.NodeTypeResponse'
      value:
        type: object
    type: object
  characters.Component_:
    properties:
      component_id:
        type: string
      name:
        type: string
      values:
        items:
          $ref: '#/definitions/characters.ComponentValue'
        type: array
    type: object
  characters.ComponentMap:
    additionalProperties:
      $ref: '#/definitions/characters.Component'
    type: object
  characters.ComponentValue:
    properties:
      keyname:
        description: template_id
        type: string
      metadata:
        additionalProperties: true
        description: type metadata
        type: object
      type:
        description: type enum (number, string, enum_tag, etc.)
        type: string
      value:
        description: actual value from component
    type: object
  characters.Entity:
    properties:
      components:
        $ref: '#/definitions/characters.EntityComponents'
      description:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  characters.EntityComponents:
    properties:
      dynamic_components:
        $ref: '#/definitions/characters.ComponentMap'
      static_components:
        $ref: '#/definitions/characters.ComponentMap'
    type: object
  characters.RowReadResponse:
    properties:
      id:
        type: string
      name:
        type: string
      player_id:
        type: string
    type: object
  characters.UpdateArgs:
    properties:
      name:
        type: string
      player_id:
        type: string
    type: object
  create.CreateCharacterBody:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  dev.CallEngineArgs:
    properties:
      body:
        additionalProperties:
          type: string
        type: object
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        type: string
      uri:
        type: string
    type: object
  dev.Response:
    properties:
      code:
        type: integer
      data:
        additionalProperties: {}
        type: object
    type: object
  enums.EnumInfos:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  nodes.CurrentTree:
    properties:
      next:
        $ref: '#/definitions/nodes.CurrentTree'
      node_id:
        type: string
    type: object
  nodes.FirstNodeResponse:
    properties:
      node_id:
        type: string
      type:
        $ref: '#/definitions/nodes.NodeTypeResponse'
    type: object
  nodes.GetNextNodeRequest:
    properties:
      current_tree:
        $ref: '#/definitions/nodes.CurrentTree'
      node_values:
        type: object
    type: object
  nodes.GetNextNodeResponse:
    properties:
      next:
        $ref: '#/definitions/nodes.NextNodeResponse'
    type: object
  nodes.NextNodeResponse:
    properties:
      final:
        type: boolean
      next:
        $ref: '#/definitions/nodes.NextNodeResponse'
      node_id:
        type: string
      type:
        $ref: '#/definitions/nodes.NodeTypeResponse'
    type: object
  nodes.NodeTypeResponse:
    properties:
      base:
        type: string
      id:
        type: string
      restrictions:
        additionalProperties: {}
        type: object
    type: object
  rulesets.CreateRulesetsArgs:
    properties:
      name:
        type: string
    type: object
  rulesets.DbReadResponse:
    properties:
      id:
        type: string
      name:
        type: string
    type: object
  rulesets.UpdateArgs:
    properties:
      name:
        type: string
    type: object
  shared_types.ComponentMap:
    type: object
  shared_types.EnumRestrictions:
    properties:
      optional:
        type: boolean
      tags:
        items:
          type: string
        type: array
    type: object
  shared_types.MultipleNodeValidation:
    properties:
      node_ids:
        items:
          type: string
        type: array
      node_values:
        type: object
    type: object
  shared_types.NodeList:
    properties:
      node_values:
        type: object
    type: object
  structs.PostResponse:
    properties:
      id:
        type: string
    type: object
  users.CreateUsersArgs:
    properties:
      email:
        type: string
      password:
        type: string
      role:
        type: string
      username:
        type: string
    type: object
  users.UpdateArgs:
    properties:
      email:
        type: string
      image:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  users.UserReadResponse:
    properties:
      email:
        type: string
      id:
        type: string
      image:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  title: D&GINE API
paths:
  /about.json:
    get:
      consumes:
      - application/json
      description: Gives informations about api
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidata.About'
      summary: Apidata - About
      tags:
      - apidata
  /api/:ruleset_id/character/:id:
    delete:
      consumes:
      - application/json
      description: Delete an empty character
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Empty object
          schema:
            additionalProperties: true
            type: object
      summary: Character - Delete
      tags:
      - character
    get:
      consumes:
      - application/json
      description: get character infos from the db
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/characters.Entity'
      summary: Character - Read
      tags:
      - character
  /api/:ruleset_id/character/:id/save:
    put:
      consumes:
      - application/json
      description: save the static components into the database.
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Empty object
          schema:
            additionalProperties: true
            type: object
      summary: Character - Save
      tags:
      - character
  /api/:ruleset_id/character/:id/submit:
    put:
      consumes:
      - application/json
      description: save a character to db and check if valid<br>save the static components
        into the database and call the type validation scripts on them.
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: Empty Object
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Character - Submit
      tags:
      - character
  /api/:ruleset_id/character/:id/validate:
    post:
      consumes:
      - application/json
      description: Validate an entity stored in the database by checking every component
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          type: string
      produces:
      - application/json
      responses:
        "200":
          description: errors
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Character - Validate entity
      tags:
      - character
  /api/:ruleset_id/character/create:
    post:
      consumes:
      - application/json
      description: create an empty character, returning his ID
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/create.CreateCharacterBody'
      produces:
      - application/json
      responses:
        "201":
          description: Created character ID
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Character - Create
      tags:
      - character
  /api/:ruleset_id/component/:id/validate:
    post:
      consumes:
      - application/json
      description: validate a component with component map
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/shared_types.ComponentMap'
      produces:
      - application/json
      responses:
        "200":
          description: Empty Object
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Components - Validate
      tags:
      - components
  /api/:ruleset_id/enums/get_by_restrictions:
    post:
      consumes:
      - application/json
      description: 'get enums infos by restrictions : get enums id, name and description
        matching the given restrictions'
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/shared_types.EnumRestrictions'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              $ref: '#/definitions/enums.EnumInfos'
            type: object
      summary: Enums - Get By Restrictions
      tags:
      - enums
  /api/:ruleset_id/first_node:
    get:
      description: Returns the first node of the given ruleset with resolved type
      parameters:
      - description: id of the ruleset
        in: path
        name: ruleset_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nodes.FirstNodeResponse'
      summary: Nodes - Get first node
      tags:
      - nodes
  /api/:ruleset_id/get_next_node/:target_node:
    post:
      consumes:
      - application/json
      description: Returns next node metadata for a given target node
      parameters:
      - description: id of the ruleset
        in: path
        name: ruleset_id
        required: true
        type: string
      - description: id of the target node
        in: path
        name: target_node
        required: true
        type: string
      - description: node values and current tree
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/nodes.GetNextNodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nodes.GetNextNodeResponse'
      summary: Nodes - Get next node
      tags:
      - nodes
  /api/:ruleset_id/node/:id/validate:
    post:
      consumes:
      - application/json
      description: validate the nodes present in the "node_ids" array in the body<br><br>Will
        return a json object with every key the invalid nodes and value the error
        output, empty json object if success
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/shared_types.MultipleNodeValidation'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.PostResponse'
      summary: Nodes - Validate multiple
      tags:
      - nodes
  /api/:ruleset_id/node/validate:
    post:
      consumes:
      - application/json
      description: validate the node present the query<br><br>Will return a json object
        with one key (the node_id) and the error message as value, empty json object
        if success
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/shared_types.NodeList'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/structs.PostResponse'
      summary: Nodes - Validate one
      tags:
      - nodes
  /api/CRUDTEMPLATEs:
    get:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Reads all CRUDTEMPLATEs
        data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CRUDTEMPLATE.DbReadResponse'
            type: array
      summary: CRUDTEMPLATE - Read
      tags:
      - CRUDTEMPLATEs
    post:
      consumes:
      - application/json
      description: ⚠️ Only accessible to admins ⚠️<br><br>Creates a CRUDTEMPLATE with
        arguments in body<br><br>Will return the id of created CRUDTEMPLATE
      parameters:
      - description: CRUDTEMPLATE related informations that will be later needed for
          the login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/CRUDTEMPLATE.CreateCRUDTEMPLATEsArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/structs.PostResponse'
      summary: CRUDTEMPLATE - Create
      tags:
      - CRUDTEMPLATEs
  /api/CRUDTEMPLATEs/id:
    delete:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Deletes the given CRUDTEMPLATE<br>
        <b>Careful, there is no turn back or check, once called, this route will delete
        the CRUDTEMPLATE no matter what</b> <br> It also deletes all content related
        to the CRUDTEMPLATE depending on the parameters of the database
      parameters:
      - description: id of the CRUDTEMPLATE to delete
        in: query
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: CRUDTEMPLATE - Delete
      tags:
      - CRUDTEMPLATEs
    get:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Reads the given CRUDTEMPLATE's
        account data
      parameters:
      - description: id of the CRUDTEMPLATE to read
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CRUDTEMPLATE.DbReadResponse'
      summary: CRUDTEMPLATE - Read ID
      tags:
      - CRUDTEMPLATEs
    put:
      consumes:
      - application/json
      description: ⚠️ Only accessible to admins ⚠️<br><br>Updates given CRUDTEMPLATE
        with arguments in body
      parameters:
      - description: id of the CRUDTEMPLATE to update
        in: query
        name: id
        required: true
        type: string
      - description: New arguments to be set in the CRUDTEMPLATE given
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/CRUDTEMPLATE.UpdateArgs'
      responses:
        "200":
          description: OK
      summary: CRUDTEMPLATE - Update
      tags:
      - CRUDTEMPLATEs
  /api/account:
    delete:
      description: <b>⚠️ The user must be logged in ⚠️</b><br><br>Deletes the user's
        account from database, the user will also be logged out<br> <b>Careful, there
        is no turn back or check, once called, this route will delete the user no
        matter what</b> <br> It also deletes all content related to the user
      responses:
        "204":
          description: No Content
      summary: Account - Delete
      tags:
      - account
    get:
      description: <b>⚠️ The user must be logged in ⚠️</b><br><br>Reads the user's
        account data<br><br>The image is a HTTP path to the user's profile picture
        using the same host:port as the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.UserReadResponse'
      summary: Account - Read
      tags:
      - account
    put:
      consumes:
      - application/json
      description: '<b>⚠️ The user must be logged in ⚠️</b><br><br>Updates the user''s
        account<br><br>The image must be base64 encoded and must contain the file
        type in the header (ex: data:image/png;base64,...)<br><br>All fields are optionals,
        if a field is empty or not provided, it will not be updated'
      parameters:
      - description: New arguments to be set in the user
        in: body
        name: id
        required: true
        schema:
          $ref: '#/definitions/account.UpdateArgs'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PostLoginResponse'
      summary: Account - Update
      tags:
      - account
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Connection of a user to an existing account<br>Token will be set
        in cookies if the arguments combination is valid
      parameters:
      - description: Email + Password combination of the corresponding user
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/auth.Creds'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PostLoginResponse'
      summary: Auth - Login
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Disconnection of the user <br>The token in the Cookies will be
        deleted after this route has been called
      responses:
        "200":
          description: OK
      summary: Auth - Logout
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 'Connection of a new user to a new account<br>Token will be set
        in cookies if the username or email is not already taken<br><br>The image
        must be base64 encoded and must contain the file type in the header (ex: data:image/png;base64,...)'
      parameters:
      - description: User related informations that will be later needed for the login
          process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.PostLoginResponse'
      summary: Auth - Register
      tags:
      - auth
  /api/characters:
    get:
      description: Reads all characters data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/characters.RowReadResponse'
            type: array
      summary: Reads all characters data
      tags:
      - characters
  /api/characters/:id:
    get:
      description: Reads the given character/entity data including all components
        and their values
      parameters:
      - description: ID of the character to read
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/characters.CharacterReadResponse'
      summary: Reads given character data with all components
      tags:
      - characters
  /api/characters/id:
    delete:
      description: Deletes the given character<br> <b>Careful, there is no turn back
        or check, once called, this route will delete the character no matter what</b>
        <br> It also deletes all content related to the character
      parameters:
      - description: id of the character to do the action on
        in: query
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Deletes given character
      tags:
      - characters
    put:
      consumes:
      - application/json
      description: ⚠️ Only accessible to admins ⚠️<br><br>Updates given character
        with arguments in body
      parameters:
      - description: id of the character to update
        in: query
        name: id
        required: true
        type: string
      - description: New arguments to be set in the character given
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/characters.UpdateArgs'
      responses:
        "200":
          description: OK
      summary: Updates given character
      tags:
      - characters
  /api/dev/callengine:
    post:
      description: Makes a HTTP call to whatever URI given using the method, headers
        and body given in argument, and returns the response of the call
      parameters:
      - description: address of the address to call
        in: body
        name: address
        required: true
        schema:
          $ref: '#/definitions/dev.CallEngineArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dev.Response'
      summary: Dev - Callengine
      tags:
      - dev
  /api/health:
    get:
      description: Healthcheck used (mainly by docker) to check if the api is up and
        ready to respond
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Apidata - Health
      tags:
      - apidata
  /api/rulesets:
    get:
      description: Reads all rulesets data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rulesets.DbReadResponse'
            type: array
      summary: Rulesets - Read
      tags:
      - rulesets
    post:
      consumes:
      - application/json
      description: Creates a ruleset with arguments in body<br><br>Will return the
        id of created ruleset
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/rulesets.CreateRulesetsArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/structs.PostResponse'
      summary: Rulesets - Create
      tags:
      - rulesets
  /api/rulesets/id:
    delete:
      description: Deletes the given ruleset<br> <b>Careful, there is no turn back
        or check, once called, this route will delete the ruleset no matter what</b>
        <br> It also deletes all content related to the ruleset depending on the parameters
        of the database
      parameters:
      - description: id of the ruleset to delete
        in: query
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Rulesets - Delete
      tags:
      - rulesets
    get:
      description: Reads the given ruleset's account data
      parameters:
      - description: id of the ruleset to read
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rulesets.DbReadResponse'
      summary: Rulesets - Read ID
      tags:
      - rulesets
    put:
