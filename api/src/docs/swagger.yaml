info:
  contact: {}
paths:
  /about.json:
    get:
      consumes:
      - application/json
      description: Gives informations about api
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/apidata.About'
      summary: Gives informations about api
      tags:
      - apidata
  /api/CRUDTEMPLATEs:
    get:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Reads all CRUDTEMPLATEs
        data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/CRUDTEMPLATE.DbReadResponse'
            type: array
      summary: Reads all CRUDTEMPLATEs data
      tags:
      - CRUDTEMPLATEs
    post:
      consumes:
      - application/json
      description: ⚠️ Only accessible to admins ⚠️<br><br>Creates a CRUDTEMPLATE with
        arguments in body<br><br>Will return the id of created CRUDTEMPLATE
      parameters:
      - description: CRUDTEMPLATE related informations that will be later needed for
          the login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/CRUDTEMPLATE.CreateCRUDTEMPLATEsArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/structs.PostResponse'
      summary: Creates a CRUDTEMPLATE
      tags:
      - CRUDTEMPLATEs
  /api/CRUDTEMPLATEs/id:
    delete:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Deletes the given CRUDTEMPLATE<br>
        <b>Careful, there is no turn back or check, once called, this route will delete
        the CRUDTEMPLATE no matter what</b> <br> It also deletes all content related
        to the CRUDTEMPLATE depending on the parameters of the database
      parameters:
      - description: id of the CRUDTEMPLATE to delete
        in: query
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Deletes given CRUDTEMPLATE
      tags:
      - CRUDTEMPLATEs
    get:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Reads the given CRUDTEMPLATE's
        account data
      parameters:
      - description: id of the CRUDTEMPLATE to read
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CRUDTEMPLATE.DbReadResponse'
      summary: Reads given CRUDTEMPLATE data
      tags:
      - CRUDTEMPLATEs
    put:
      consumes:
      - application/json
      description: ⚠️ Only accessible to admins ⚠️<br><br>Updates given CRUDTEMPLATE
        with arguments in body
      parameters:
      - description: id of the CRUDTEMPLATE to update
        in: query
        name: id
        required: true
        type: string
      - description: New arguments to be set in the CRUDTEMPLATE given
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/CRUDTEMPLATE.UpdateArgs'
      responses:
        "200":
          description: OK
      summary: Updates given CRUDTEMPLATE
      tags:
      - CRUDTEMPLATEs
  /api/account:
    delete:
      description: <b>⚠️ The user must be logged in ⚠️</b><br><br>Deletes the user's
        account from database, the user will also be logged out<br> <b>Careful, there
        is no turn back or check, once called, this route will delete the user no
        matter what</b> <br> It also deletes all content related to the user
      responses:
        "204":
          description: No Content
      summary: Deletes the user's account
      tags:
      - account
    get:
      description: <b>⚠️ The user must be logged in ⚠️</b><br><br>Reads the user's
        account data<br><br>The image is a HTTP path to the user's profile picture
        using the same host:port as the API
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/account.UserReadResponse'
      summary: Reads the user's account data
      tags:
      - account
    put:
      consumes:
      - application/json
      description: '<b>⚠️ The user must be logged in ⚠️</b><br><br>Updates the user''s
        account<br><br>The image must be base64 encoded and must contain the file
        type in the header (ex: data:image/png;base64,...)<br><br>All fields are optionals,
        if a field is empty or not provided, it will not be updated'
      parameters:
      - description: New arguments to be set in the user
        in: body
        name: id
        required: true
        schema:
          $ref: '#/definitions/account.UpdateArgs'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PostLoginResponse'
      summary: Updates the user's account
      tags:
      - account
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: Connection of a user to an existing account<br>Token will be set
        in cookies if the arguments combination is valid
      parameters:
      - description: Email + Password combination of the corresponding user
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/auth.Creds'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.PostLoginResponse'
      summary: Connection of a user to an existing account
      tags:
      - auth
  /api/auth/logout:
    post:
      description: Disconnection of the user <br>The token in the Cookies will be
        deleted after this route has been called
      responses:
        "200":
          description: OK
      summary: Disconnection of the user
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 'Connection of a new user to a new account<br>Token will be set
        in cookies if the username or email is not already taken<br><br>The image
        must be base64 encoded and must contain the file type in the header (ex: data:image/png;base64,...)'
      parameters:
      - description: User related informations that will be later needed for the login
          process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.PostLoginResponse'
      summary: Connection of a new user to a new account
      tags:
      - auth
  /api/characters:
    get:
      description: Reads all characters data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/characters.RowReadResponse'
            type: array
      summary: Reads all characters data
      tags:
      - characters
  /api/characters/create/firstnode:
    get:
      consumes:
      - application/json
      description: Returns the first node of the given ruleset character creation
        tree
      parameters:
      - description: character related informations that will be later needed for
          the login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/charactersCreate.FirstNodeArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/charactersCreate.RulesetFirstNode'
      summary: Returns the first node of the given ruleset
      tags:
      - characters creation
  /api/characters/create/nextnode:
    get:
      consumes:
      - application/json
      description: Returns the next node of the given node depending on the ruleset
        character creation tree<br><br>This will check for the tree for all childs
        of the given node, and return the one(s) that match the condition with the
        given value<br><br>If no child matches the condition, it means that the character
        creation process is finished, and the frontend can send the character creation
        submission request
      parameters:
      - description: Actual node id, along with the value and type of the component
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/charactersCreate.NextNodeArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/charactersCreate.NextNodeResponse'
            type: array
      summary: Returns the next node
      tags:
      - characters creation
  /api/characters/create/submit:
    post:
      consumes:
      - application/json
      description: Submits a character list of components and creates the character
        in database<br><br>Will return the id of created character
      parameters:
      - description: character related informations that will be later needed for
          the login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/charactersCreate.CreateArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/charactersCreate.RulesetFirstNode'
      summary: Submits a character list of components
      tags:
      - characters creation
  /api/characters/id:
    delete:
      description: Deletes the given character<br> <b>Careful, there is no turn back
        or check, once called, this route will delete the character no matter what</b>
        <br> It also deletes all content related to the character
      parameters:
      - description: id of the character to do the action on
        in: query
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Deletes given character
      tags:
      - characters
    get:
      description: Reads the given character data
      parameters:
      - description: id of the character to read
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/characters.RowReadResponse'
      summary: Reads given character data
      tags:
      - characters
    put:
      consumes:
      - application/json
      description: ⚠️ Only accessible to admins ⚠️<br><br>Updates given character
        with arguments in body
      parameters:
      - description: id of the character to update
        in: query
        name: id
        required: true
        type: string
      - description: New arguments to be set in the character given
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/characters.UpdateArgs'
      responses:
        "200":
          description: OK
      summary: Updates given character
      tags:
      - characters
  /api/dev/callengine:
    post:
      description: Makes a HTTP call to whatever URI given using the method, headers
        and body given in argument, and returns the response of the call
      parameters:
      - description: address of the address to call
        in: body
        name: address
        required: true
        schema:
          $ref: '#/definitions/dev.CallEngineArgs'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dev.Response'
      summary: Transmit a request via API
      tags:
      - dev
  /api/health:
    get:
      description: Healthcheck used (mainly by docker) to check if the api is up and
        ready to respond
      produces:
      - text/plain
      responses:
        "200":
          description: OK
          schema:
            type: string
      summary: Healthcheck for the api
      tags:
      - apidata
  /api/rulesets:
    get:
      description: Reads all rulesets data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/rulesets.DbReadResponse'
            type: array
      summary: Reads all rulesets data
      tags:
      - rulesets
    post:
      consumes:
      - application/json
      description: Creates a ruleset with arguments in body<br><br>Will return the
        id of created ruleset
      parameters:
      - description: ruleset related informations that will be later needed for the
          login process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/rulesets.CreateRulesetsArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/structs.PostResponse'
      summary: Creates a ruleset
      tags:
      - rulesets
  /api/rulesets/id:
    delete:
      description: Deletes the given ruleset<br> <b>Careful, there is no turn back
        or check, once called, this route will delete the ruleset no matter what</b>
        <br> It also deletes all content related to the ruleset depending on the parameters
        of the database
      parameters:
      - description: id of the ruleset to delete
        in: query
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Deletes given ruleset
      tags:
      - rulesets
    get:
      description: Reads the given ruleset's account data
      parameters:
      - description: id of the ruleset to read
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/rulesets.DbReadResponse'
      summary: Reads given ruleset data
      tags:
      - rulesets
    put:
      consumes:
      - application/json
      description: Updates given ruleset with arguments in body
      parameters:
      - description: id of the ruleset to update
        in: query
        name: id
        required: true
        type: string
      - description: New arguments to be set in the ruleset given
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/rulesets.UpdateArgs'
      responses:
        "200":
          description: OK
      summary: Updates given ruleset
      tags:
      - rulesets
  /api/users:
    get:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Reads all users data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/users.UserReadResponse'
            type: array
      summary: Reads all users data
      tags:
      - users
    post:
      consumes:
      - application/json
      description: ⚠️ Only accessible to admins ⚠️<br><br>Creates a user with arguments
        in body
      parameters:
      - description: User related informations that will be later needed for the login
          process
        in: body
        name: creds
        required: true
        schema:
          $ref: '#/definitions/users.CreateUsersArgs'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/structs.PostResponse'
      summary: Creates a user
      tags:
      - users
  /api/users/id:
    delete:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Deletes the given user<br>
        <b>Careful, there is no turn back or check, once called, this route will delete
        the user no matter what</b> <br> It also deletes all content related to the
        user
      parameters:
      - description: id of the user to do the action on
        in: query
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: Deletes given user
      tags:
      - users
    get:
      description: ⚠️ Only accessible to admins ⚠️<br><br>Reads the given user data
      parameters:
      - description: id of the user to do the action on
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserReadResponse'
      summary: Reads given user data
      tags:
      - users
    put:
      consumes:
      - application/json
      description: ⚠️ Only accessible to admins ⚠️<br><br>Updates given user with
        arguments in body
      parameters:
      - description: id of the user to do the action on
        in: query
        name: id
        required: true
        type: string
      - description: New arguments to be set in the user given, along with its id
        in: body
        name: data
        required: true
        schema:
          $ref: '#/definitions/users.UpdateArgs'
      responses:
        "200":
          description: OK
      summary: Updates given user
      tags:
      - users
  '/img/:filepath:':
    get:
      description: Reads an image file
      produces:
      - image/png
      responses:
        "200":
          description: OK
      summary: Reads an image file
      tags:
      - img
swagger: "2.0"
